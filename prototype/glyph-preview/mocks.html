<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contour and theme packs</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #05070b; color: #f4f6f8; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    header.page { max-width: 980px; margin: 0 auto; padding: 26px 20px 0; }
    header.page h1 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.03em; }
    header.page p { margin: 0; color: #9aa3b2; max-width: 70ch; line-height: 1.45; }
    .controls { max-width: 980px; margin: 16px auto 0; padding: 0 20px; }
    .packs { display: flex; flex-wrap: wrap; gap: 8px; }
    .packs button, .jumps button {
      background: #141922; color: #f4f6f8; border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 0.82rem; font-weight: 650; cursor: pointer;
    }
    .packs button.on, .jumps button.on { border-color: #fff; }
    .slider { display: flex; align-items: center; gap: 12px; margin-top: 12px; color: #c5ccd6; font-size: 0.82rem; }
    .slider strong { width: 92px; font-weight: 650; }
    .slider input { flex: 1; }
    .slider span { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
    input.hue {
      -webkit-appearance: none; appearance: none; height: 18px; border-radius: 999px;
      background: linear-gradient(90deg,
        hsl(0,92%,56%), hsl(30,95%,54%), hsl(55,95%,52%), hsl(90,80%,48%),
        hsl(140,75%,46%), hsl(175,80%,46%), hsl(210,90%,58%), hsl(250,85%,62%),
        hsl(290,85%,60%), hsl(330,90%,58%), hsl(360,92%,56%));
    }
    input.hue::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: #fff; border: 3px solid #111; box-shadow: 0 0 0 2px var(--edge, #fff);
    }
    input.hue::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid #111;
    }
    input.vis { accent-color: var(--edge, #e2b657); }
    .jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .strip { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
    .strip canvas, .strip img.glyph { width: 104px; height: 104px; object-fit: contain; }
    .row { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; padding: 18px 16px 64px; }
    .col { width: 390px; }
    .col h2 { margin: 0 0 10px; font-size: 0.95rem; }
    .col h2 span { color: #9aa3b2; font-weight: 500; }
    .phone {
      width: 390px; height: 760px; background: #07090d; border: 1px solid rgba(255,255,255,.1);
      border-radius: 36px; overflow: hidden; position: relative; box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .status { display: flex; justify-content: space-between; padding: 14px 22px 0; font-size: 0.75rem; font-weight: 650; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
    .brand strong { display: block; font-size: 1rem; }
    .brand em { font-style: normal; color: #5b9fff; font-size: 0.72rem; font-weight: 650; }
    .chip { display: flex; align-items: center; gap: 8px; border: 1px solid rgba(91,159,255,.45); background: rgba(91,159,255,.12); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 750; font-size: 0.82rem; }
    .chip img { width: 32px; height: 32px; object-fit: contain; }
    .body { padding: 4px 16px 96px; }
    .mod-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; }
    .mod-head h3 { margin: 0; font-size: 0.95rem; }
    .mod-head span { color: #5b9fff; font-size: 0.78rem; font-weight: 650; }
    .rail { display: flex; gap: 8px; }
    .rail figure { margin: 0; width: 62px; text-align: center; }
    .rail img { width: 62px; height: 62px; object-fit: contain; }
    .rail figcaption { font-size: 0.62rem; color: #9aa3b2; }
    .hero { margin-top: 12px; min-height: 120px; border-radius: 18px; border: 1px solid rgba(91,159,255,.28); background: radial-gradient(90% 120% at 88% 50%, rgba(91,159,255,.28), transparent 58%), #121722; position: relative; }
    .hero img { position: absolute; right: 4px; top: 50%; width: 120px; height: 110px; object-fit: contain; transform: translateY(-50%); }
    .hero div { padding: 14px 130px 14px 14px; }
    .kicker { color: #5b9fff; font-size: 0.62rem; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
    .hero h3 { margin: 4px 0 0; font-size: 1rem; }
    .hero p { margin: 4px 0 0; color: #9aa3b2; font-size: 0.72rem; line-height: 1.35; }
    .card { margin-top: 10px; background: #141922; border: 1px solid rgba(255,255,255,.06); border-radius: 16px; padding: 12px 14px; }
    .card strong { display: block; font-size: 0.88rem; }
    .card span { color: #9aa3b2; font-size: 0.72rem; }
    .tabs {
      position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px 12px; background: rgba(10,12,16,.94); border-top: 1px solid rgba(255,255,255,.06);
    }
    .tabs div { text-align: center; font-size: 0.62rem; color: #8e97a8; }
    .tabs canvas, .tabs img.glyph { width: 42px; height: 42px; margin: 0 auto 2px; display: block; object-fit: contain; }
    .tabs .on { color: #5b9fff; font-weight: 700; }
  </style>
</head>
<body>
  <header class="page">
    <h1>Contour line, full spectrum</h1>
    <p>The slider runs every hue from 0 to 360. Visibility thickens or thins only the outer contour, so the line can be stronger on a screen that washes color out. Theme packs change the icon body. The gear keeps its own colors.</p>
  </header>
  <div class="controls">
    <div class="packs" id="packs"></div>
    <label class="slider"><strong>Hue</strong><input class="hue" id="hue" type="range" min="0" max="360" value="43" /><span id="hueLabel">43°</span></label>
    <label class="slider"><strong>Visibility</strong><input class="vis" id="vis" type="range" min="0" max="100" value="46" /><span id="visLabel">46</span></label>
    <div class="jumps" id="jumps"></div>
    <div class="strip" id="strip"></div>
  </div>
  <div class="row">
    <div class="col">
      <h2 id="packTitle">Fight night</h2>
      <div class="phone" id="phone"></div>
    </div>
  </div>
  <script>
    const JOBS = ["home", "gyms", "partners", "feed", "profile"];
    const NAMES = ["Home", "Gyms", "Partners", "Feed", "Profile"];
    const PACKS = [
      { id: "fight", name: "Fight night", art: "f", mode: "photo" },
      { id: "neon", name: "Neon", art: "n", mode: "photo" },
      { id: "chalk", name: "Chalk", art: "k", mode: "photo" },
      { id: "ice", name: "Ice", art: "i", mode: "photo" },
      { id: "bright", name: "Bright", art: "r", mode: "photo" }
    ];
    const JUMPS = [
      ["Gold", 43], ["Crimson", 4], ["Orange", 24], ["Lime", 92],
      ["Emerald", 142], ["Cyan", 178], ["Royal", 218], ["Violet", 278], ["Magenta", 322]
    ];
    const images = new Map();
    const cache = new Map();
    let pack = PACKS[0];
    let hue = 43;
    let vis = 46;

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0;
      if (d) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        if (h < 0) h += 6;
      }
      return [h / 6, max === 0 ? 0 : d / max, max];
    }
    function hsvToRgb(h, s, v) {
      const i = Math.floor(h * 6) % 6;
      const f = h * 6 - Math.floor(h * 6);
      const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
      return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i].map((x) => Math.round(x * 255));
    }
    function edt1d(f) {
      const n = f.length;
      const d = new Float64Array(n);
      const v = new Int32Array(n);
      const z = new Float64Array(n + 1);
      let k = 0;
      v[0] = 0;
      z[0] = -Infinity;
      z[1] = Infinity;
      for (let q = 1; q < n; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) {
          k--;
          s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        }
        k++;
        v[k] = q;
        z[k] = s;
        z[k + 1] = Infinity;
      }
      k = 0;
      for (let q = 0; q < n; q++) {
        while (z[k + 1] < q) k++;
        const dx = q - v[k];
        d[q] = dx * dx + f[v[k]];
      }
      return d;
    }
    function distanceToZero(zeroAt, w, h) {
      const INF = 1e15;
      const tmp = new Float64Array(w * h);
      const col = new Float64Array(h);
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) col[y] = zeroAt[y * w + x] ? 0 : INF;
        const d = edt1d(col);
        for (let y = 0; y < h; y++) tmp[y * w + x] = d[y];
      }
      const out = new Float32Array(w * h);
      const row = new Float64Array(w);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) row[x] = tmp[y * w + x];
        const d = edt1d(row);
        for (let x = 0; x < w; x++) out[y * w + x] = Math.sqrt(Math.max(0, d[x]));
      }
      return out;
    }
    function loadImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { images.set(file, img); resolve(); };
        img.onerror = () => resolve();
        img.src = file + "?v=14";
      });
    }
    function boxBlur(src, w, h, radius) {
      const tmp = new Float32Array(src.length);
      const dst = new Float32Array(src.length);
      const span = radius * 2 + 1;
      for (let y = 0; y < h; y++) {
        let sum = 0;
        for (let k = -radius; k <= radius; k++) sum += src[y * w + Math.min(w - 1, Math.max(0, k))];
        for (let x = 0; x < w; x++) {
          tmp[y * w + x] = sum / span;
          sum -= src[y * w + Math.min(w - 1, Math.max(0, x - radius))];
          sum += src[y * w + Math.min(w - 1, Math.max(0, x + radius + 1))];
        }
      }
      for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let k = -radius; k <= radius; k++) sum += tmp[Math.min(h - 1, Math.max(0, k)) * w + x];
        for (let y = 0; y < h; y++) {
          dst[y * w + x] = sum / span;
          sum -= tmp[Math.min(h - 1, Math.max(0, y - radius)) * w + x];
          sum += tmp[Math.min(h - 1, Math.max(0, y + radius + 1)) * w + x];
        }
      }
      return dst;
    }
    function trimFile(file) { return file.replace(/\.png$/, "-trim.png"); }
    function sourceOf(file) {
      if (cache.has(file)) return cache.get(file);
      const img = images.get(file);
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const snap = ctx.getImageData(0, 0, w, h);
      const maskImg = images.get(trimFile(file));
      const mask = new Uint8Array(w * h);
      if (maskImg) {
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(maskImg, 0, 0, w, h);
        const md = ctx.getImageData(0, 0, w, h).data;
        for (let i = 0, p = 0; i < mask.length; i++, p += 4) mask[i] = md[p];
      }
      const reachMax = 6 * (w / 104) + 8;
      const pad = Math.ceil(reachMax);
      const W = w + pad * 2;
      const H = h + pad * 2;
      const fg = new Uint8Array(W * H);
      let minX = w, minY = h, maxX = 0, maxY = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const a = snap.data[(y * w + x) * 4 + 3];
          if (a > 20) {
            fg[(y + pad) * W + (x + pad)] = 1;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < minX) { minX = 0; minY = 0; maxX = w - 1; maxY = h - 1; }
      const outside = distanceToZero(fg, W, H);
      const sheet = document.createElement("canvas");
      sheet.width = W;
      sheet.height = H;
      const base = new Uint8ClampedArray(W * H * 4);
      const maskList = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          const o = ((y + pad) * W + (x + pad)) * 4;
          const q = i * 4;
          base[o] = snap.data[q];
          base[o + 1] = snap.data[q + 1];
          base[o + 2] = snap.data[q + 2];
          base[o + 3] = snap.data[q + 3];
          if (mask[i] >= 38) maskList.push(i);
        }
      }
      const strokeList = [];
      for (let i = 0; i < outside.length; i++) {
        const od = outside[i];
        if (od > 0 && od < reachMax) strokeList.push(i);
      }
      const rec = {
        w, h, W, H, pad, snap, mask, outside, sheet, base,
        maskList: new Uint32Array(maskList),
        strokeList: new Uint32Array(strokeList),
        box: { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 }
      };
      cache.set(file, rec);
      return rec;
    }
    function shiftHue(r, g, b, target, t, m) {
      const hsv = rgbToHsv(r, g, b);
      const s = hsv[1];
      const v = hsv[2];
      const floor = 0.32 + 0.55 * t;
      const lifted = Math.min(1, Math.max(s, floor) + (1 - Math.max(s, floor)) * 0.22 * t);
      const lit = Math.min(1, v * (1 + 0.4 * t) + 0.05 * t);
      // A faint mask keeps the pixel's own saturation. Only a solid trim is lifted.
      const sat = s + (lifted - s) * m;
      const val = v + (lit - v) * m;
      return hsvToRgb(target, sat, val);
    }
    function renderSheet(src, hueDeg, visibility) {
      const { w, h, W, H, pad, snap, mask, outside, base, maskList, strokeList } = src;
      const out = new ImageData(W, H);
      const d = out.data;
      d.set(base);
      const s = snap.data;
      const t = Math.max(0, Math.min(1, visibility / 100));
      const target = ((hueDeg % 360) + 360) % 360 / 360;
      const reach = t * 5.5 * (w / 104);
      const stroke = hsvToRgb(target, 0.96, 0.4 + 0.58 * t);
      const feather = Math.max(1.1, reach * 0.22);
      for (let n = 0; n < maskList.length; n++) {
        const i = maskList[n];
        const m = mask[i] / 255;
        const y = (i / w) | 0;
        const x = i - y * w;
        const p = ((y + pad) * W + (x + pad)) * 4;
        const q = i * 4;
        const rgb = shiftHue(s[q], s[q + 1], s[q + 2], target, t, m);
        d[p] = s[q] * (1 - m) + rgb[0] * m;
        d[p + 1] = s[q + 1] * (1 - m) + rgb[1] * m;
        d[p + 2] = s[q + 2] * (1 - m) + rgb[2] * m;
      }
      if (reach > 0.3) {
        const limit = reach + feather;
        for (let n = 0; n < strokeList.length; n++) {
          const i = strokeList[n];
          const od = outside[i];
          if (od >= limit) continue;
          const cover = od <= reach ? 1 : 1 - (od - reach) / feather;
          const sa = cover * (0.62 + 0.38 * t);
          const p = i * 4;
          const da = d[p + 3] / 255;
          const outA = sa + da * (1 - sa);
          if (outA <= 0) continue;
          d[p] = (stroke[0] * sa + d[p] * da * (1 - sa)) / outA;
          d[p + 1] = (stroke[1] * sa + d[p + 1] * da * (1 - sa)) / outA;
          d[p + 2] = (stroke[2] * sa + d[p + 2] * da * (1 - sa)) / outA;
          d[p + 3] = Math.min(255, outA * 255);
        }
      }
      const sheetCtx = src.sheet.getContext("2d");
      sheetCtx.putImageData(out, 0, 0);
    }
    function blit(canvas, src) {
      const ctx = canvas.getContext("2d");
      const box = src.box;
      const padX = canvas.width * 0.07;
      const padTop = canvas.height * 0.06;
      const padBot = canvas.height * 0.05;
      const availW = canvas.width - padX * 2;
      const availH = canvas.height - padTop - padBot;
      const scale = Math.min(availW / box.w, availH / box.h);
      const contentW = box.w * scale;
      const contentH = box.h * scale;
      const contentLeft = (canvas.width - contentW) / 2;
      const contentTop = canvas.height - padBot - contentH;
      const extra = src.pad;
      const sx = box.x + src.pad - extra;
      const sy = box.y + src.pad - extra;
      const sw = box.w + extra * 2;
      const sh = box.h + extra * 2;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(
        src.sheet,
        sx, sy, sw, sh,
        contentLeft - extra * scale,
        contentTop - extra * scale,
        sw * scale,
        sh * scale
      );
    }
    function paint(canvas, file, mode, hueDeg, visibility) {
      const src = sourceOf(file);
      if (src.paintedHue !== hueDeg || src.paintedVis !== visibility) {
        renderSheet(src, hueDeg, visibility);
        src.paintedHue = hueDeg;
        src.paintedVis = visibility;
      }
      blit(canvas, src);
    }
    function fileOf(art, job) { return art + "-" + job + ".png"; }

    function iconHTML(job) {
      return `<canvas width="168" height="168" data-file="${fileOf(pack.art, job)}"></canvas>`;
    }
    function build() {
      const phone = document.getElementById("phone");
      const tabs = JOBS.map((job, i) =>
        `<div class="${i === 0 ? "on" : ""}">${iconHTML(job)}${NAMES[i]}</div>`
      ).join("");
      phone.innerHTML = `
        <div class="status"><span>9:41</span><span>5G</span></div>
        <div class="head"><div class="brand"><strong>RollPhase</strong><em>${pack.name}</em></div>
          <div class="chip"><img src="sport-bjj.png?v=7" alt="" />BJJ</div></div>
        <div class="body">
          <div class="mod-head"><h3>Your sports</h3><span>Browse all</span></div>
          <div class="rail">
            <figure><img src="sport-bjj.png?v=7" alt="" /><figcaption>BJJ</figcaption></figure>
            <figure><img src="sport-boxing.png?v=7" alt="" /><figcaption>Boxing</figcaption></figure>
            <figure><img src="sport-mma.png?v=7" alt="" /><figcaption>MMA</figcaption></figure>
            <figure><img src="sport-yoga.png?v=7" alt="" /><figcaption>Yoga</figcaption></figure>
            <figure><img src="sport-pickle.png?v=7" alt="" /><figcaption>Pickle</figcaption></figure>
          </div>
          <div class="hero"><img src="sport-bjj.png?v=7" alt="" /><div>
            <div class="kicker">Today’s focus</div><h3>Brazilian Jiu-Jitsu</h3>
            <p>Tabs use ${pack.name}. Drag hue anywhere on the bar. Visibility changes only the contour.</p>
          </div></div>
          <div class="card"><strong>Nearby venues</strong><span>The map fills this once a city is set.</span></div>
        </div>
        <nav class="tabs">${tabs}</nav>`;
      const strip = document.getElementById("strip");
      strip.innerHTML = JOBS.map((job) =>
        `<canvas width="312" height="312" data-file="${fileOf(pack.art, job)}"></canvas>`
      ).join("");
      document.getElementById("packTitle").textContent = pack.name;
      paintAll();
    }
    function paintAll() {
      document.querySelectorAll("canvas[data-file]").forEach((canvas) => {
        paint(canvas, canvas.dataset.file, pack.mode, hue, vis);
      });
      const sw = hsvToRgb(hue / 360, 0.9, 1);
      document.documentElement.style.setProperty("--edge", `rgb(${sw[0]},${sw[1]},${sw[2]})`);
    }
    function renderPacks() {
      const host = document.getElementById("packs");
      host.innerHTML = "";
      PACKS.forEach((p) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = p.name;
        btn.classList.toggle("on", p.id === pack.id);
        btn.addEventListener("click", () => { pack = p; renderPacks(); build(); });
        host.appendChild(btn);
      });
    }
    function syncLabels() {
      const near = JUMPS.find((j) => Math.abs(j[1] - hue) <= 3);
      document.getElementById("hueLabel").textContent = near ? hue + "° " + near[0] : hue + "°";
      document.getElementById("visLabel").textContent = String(vis);
      document.getElementById("hue").value = String(hue);
      document.getElementById("vis").value = String(vis);
      [...document.getElementById("jumps").children].forEach((btn) => {
        btn.classList.toggle("on", near && btn.textContent === near[0]);
      });
    }
    JUMPS.forEach(([name, deg]) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = name;
      btn.addEventListener("click", () => { hue = deg; syncLabels(); paintAll(); });
      document.getElementById("jumps").appendChild(btn);
    });
    document.getElementById("hue").addEventListener("input", (e) => {
      hue = Number(e.target.value);
      syncLabels();
      paintAll();
    });
    document.getElementById("vis").addEventListener("input", (e) => {
      vis = Number(e.target.value);
      syncLabels();
      paintAll();
    });

    const q = new URLSearchParams(location.search);
    if (q.get("hue")) hue = Number(q.get("hue"));
    if (q.get("vis")) vis = Number(q.get("vis"));
    const asked = PACKS.find((p) => p.id === q.get("pack"));
    if (asked) pack = asked;
    const files = new Set();
    PACKS.forEach((p) => JOBS.forEach((job) => {
      const file = fileOf(p.art, job);
      files.add(file);
      files.add(trimFile(file));
    }));
    Promise.all([...files].map(loadImage)).then(() => {
      syncLabels();
      renderPacks();
      build();
      document.body.dataset.ready = "1";
    });
  </script>
</body>
</html>
